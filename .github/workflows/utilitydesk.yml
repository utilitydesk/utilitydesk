name: UtilityDesk SEO Automation

on:
  push:
    branches:
      - main

jobs:
  seo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Sitemap
        run: node scripts/generate-sitemap.js

      - name: Verify Sitemap
        run: |
          test -f sitemap.xml
          echo "✅ Sitemap generated"

      - name: Detect Changed HTML Files
        shell: bash
        run: |
          git diff --name-only HEAD~1 HEAD > changed.txt

      - name: Build URL List
        shell: bash
        run: |
          echo "[" > urls.json
          first=true

          while read file; do

            if [[ "$file" == *.html ]]; then

              url="https://utilitydesk.in/${file}"
              url="${url/index.html/}"

              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> urls.json
              fi

              echo "\"$url\"" >> urls.json

            fi

          done < changed.txt

          echo "]" >> urls.json

          cat urls.json

      - name: Submit to IndexNow
        shell: bash
        run: |

          if [ "$(cat urls.json)" = "[]" ]; then
            echo "No HTML pages changed."
            exit 0
          fi

          URLS=$(cat urls.json)

          curl -X POST https://api.indexnow.org/indexnow \
          -H "Content-Type: application/json" \
          -d "{
            \"host\":\"utilitydesk.in\",
            \"key\":\"922a92cb14844b0abb11650b3397a8b0\",
            \"keyLocation\":\"https://utilitydesk.in/922a92cb14844b0abb11650b3397a8b0.txt\",
            \"urlList\":$URLS
          }"

      - name: Upload Sitemap
        uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: sitemap.xml